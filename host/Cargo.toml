[package]
name = "host"
version = "0.1.0"
edition = "2024"
default-run = "simple"
autobins = false

[[bin]]
name = "simple"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
gilrs = "0.11"
serialport = "4"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
