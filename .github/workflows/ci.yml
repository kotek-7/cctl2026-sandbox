name: CI

# 基板ロジック、PC操縦プログラム、SVMDを検証する。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install clang-format==18.1.8
      - run: make format-check

  tests:
    name: codec tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        working-directory: tests
        run: cmake --preset default

      - name: Build
        working-directory: tests
        run: cmake --build --preset default

      - name: Test
        working-directory: tests
        run: ctest --preset default

  pc:
    name: PC control (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - run: cargo build --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  svmd:
    name: svmd (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        working-directory: svmd
        run: pio run

  stm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib ninja-build
      - run: make build-cctl build-serial-svmd
