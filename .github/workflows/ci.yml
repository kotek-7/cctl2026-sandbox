name: CI

# 基板ロジック、PC操縦プログラム、SVMDを検証する。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: domain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        working-directory: tests
        run: cmake --preset default

      - name: Build
        working-directory: tests
        run: cmake --build --preset default

      - name: Test
        working-directory: tests
        run: ctest --preset default

  pc:
    name: PC control (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests/python -v

  svmd:
    name: svmd (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        working-directory: svmd
        run: pio run
